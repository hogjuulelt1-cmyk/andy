<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="/fit/manifest.webmanifest">
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1514" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тэнхээ">
<title>Тэнхээ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --sunk:#E3EAE7; --ink:#16211F; --muted:#5F6E6A; --line:#D5DEDA;
  --accent:#B8741A; --accent-ink:#FFFFFF; --accent-soft:#F6E9D2;
  --ok:#2F7D4F; --ok-soft:#E1F0E6; --warn:#C2611C; --warn-soft:#FBE9DC; --bad:#B2362E; --bad-soft:#F9E3E0;
  --c-strength:#B8741A; --c-yoga:#1F6F7A; --c-pilates:#6B4FA0; --c-mobility:#4E8A5C; --c-walk:#4A6FA5; --c-breath:#1F6F7A; --c-mix:#B8741A;
  --bar-bg:rgba(238,243,241,.82); --scrim:rgba(22,33,31,.4);
  --ease:cubic-bezier(.32,.72,0,1);
  --display:"Unbounded",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-card:14px; --r-in:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1514; --surface:#182220; --sunk:#22302D; --ink:#ECF1EF; --muted:#98A8A3; --line:#2C3A36;
    --accent:#E0A24A; --accent-ink:#1B1206; --accent-soft:#3A2A10;
    --ok:#4FB372; --ok-soft:#163322; --warn:#E88A4A; --warn-soft:#3A2412; --bad:#E5665C; --bad-soft:#3D1715;
    --c-strength:#E0A24A; --c-yoga:#4FB3C0; --c-pilates:#A58BD9; --c-mobility:#7FC08D; --c-walk:#86A9E0; --c-breath:#4FB3C0; --c-mix:#E0A24A;
    --bar-bg:rgba(14,21,20,.8); --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1514; --surface:#182220; --sunk:#22302D; --ink:#ECF1EF; --muted:#98A8A3; --line:#2C3A36;
  --accent:#E0A24A; --accent-ink:#1B1206; --accent-soft:#3A2A10;
  --ok:#4FB372; --ok-soft:#163322; --warn:#E88A4A; --warn-soft:#3A2412; --bad:#E5665C; --bad-soft:#3D1715;
  --c-strength:#E0A24A; --c-yoga:#4FB3C0; --c-pilates:#A58BD9; --c-mobility:#7FC08D; --c-walk:#86A9E0; --c-breath:#4FB3C0; --c-mix:#E0A24A;
  --bar-bg:rgba(14,21,20,.8); --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{background:var(--bg);overflow-x:hidden;overscroll-behavior-y:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:env(safe-area-inset-top,0px) 16px calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100dvh}
body.bare{padding-bottom:24px}
[hidden]{display:none!important}
button,a,[data-act]{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-family:var(--display);font-weight:600;font-size:1.6rem;letter-spacing:-.02em;line-height:1.15}
h2{font-family:var(--display);font-weight:500;font-size:1.15rem;letter-spacing:-.02em}
h3{font-size:1rem;font-weight:600}
p{margin:0;max-width:70ch}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px!important}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.big{font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 0;min-height:48px}
.mark{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:-.02em;color:var(--ink)}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--ok)} .sync.saving .dot{background:var(--warn)} .sync.err .dot{background:var(--bad)} .sync.local .dot{background:var(--line)}
body.bare header.top{display:none}
#main{display:flex;flex-direction:column;gap:16px;min-height:40vh}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar-bg);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:0;background:none;padding:5px 0 3px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:500;color:var(--muted);min-height:48px}
nav.tabs button .ic{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
body.bare nav.tabs{display:none}
@media (prefers-reduced-transparency: reduce){nav.tabs{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;position:relative}
.card.sunk{background:var(--sunk);border-color:transparent}
.card.rail{padding-left:20px}
.card.rail::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 3px 3px 0;background:var(--rc,var(--accent))}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-inline:0;border-bottom:0;color:inherit;min-height:48px}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.li .txt{flex:1;min-width:0}
.li .txt b{display:block;font-weight:600;line-height:1.3}
.li .txt small{display:block;color:var(--muted);font-size:.84rem;line-height:1.4}
.li .chev{color:var(--muted);transition:transform .22s var(--ease)}
.li[aria-expanded="true"] .chev{transform:rotate(90deg)}
.dot-c{width:10px;height:10px;border-radius:50%;background:var(--rc,var(--line));flex:none}
.tag{font-size:.78rem;font-weight:500;color:var(--muted);white-space:nowrap}
.pill{font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.na{background:var(--sunk);color:var(--muted)}
.note{background:var(--sunk);border-radius:var(--r-in);padding:10px 12px;font-size:.9rem;color:var(--ink)}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)} .note.ok{background:var(--ok-soft)}
.empty{color:var(--muted);text-align:center;padding:20px 8px}

/* why chips: the one memorable element */
.why{display:flex;flex-wrap:wrap;gap:6px}
.why span{display:inline-flex;align-items:flex-start;gap:5px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:4px 11px 4px 8px;font-size:.8rem;line-height:1.35;max-width:100%}
.why span .ic{width:13px;height:13px;color:var(--accent);margin-top:3px}
.why .why-more{display:inline-flex;align-items:center;min-height:44px;margin:-8px 0;padding:0 11px;border:1px dashed var(--accent);border-radius:999px;background:transparent;color:var(--accent);font-size:.8rem;font-weight:500}
.why .why-rest{display:contents}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;align-items:end}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .big{font-size:1.8rem}
.stat .big small{white-space:nowrap}
.stat .big.mid{font-size:1.35rem;padding-top:.3rem}
.stat .big small{font-family:var(--body);font-weight:500;font-size:.9rem;letter-spacing:0;color:var(--muted);margin-left:2px}
.stat span{font-size:.82rem;color:var(--muted)}
.bar{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.ok i{background:var(--ok)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.88rem;font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],input:not([type]),select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-in);padding:10px 12px;min-height:46px;color:var(--ink)}
input::placeholder{color:var(--muted);opacity:.8}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:.92rem;font-weight:500;min-height:44px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .ord{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:600;display:inline-grid;place-items:center;margin-left:-4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px;text-align:left;min-height:52px;color:inherit;width:100%}
.opt b{font-weight:600;display:block}
.opt small{display:block;color:var(--muted);font-size:.84rem}
.opt .txt{flex:1;min-width:0}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt .ord{width:24px;height:24px;border-radius:50%;background:var(--sunk);color:var(--muted);font-size:.78rem;font-weight:600;display:grid;place-items:center;flex:none}
.opt.on .ord{background:var(--accent);color:var(--accent-ink)}
.seg{display:flex;background:var(--sunk);border-radius:var(--r-in);padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-size:.9rem;font-weight:500;color:var(--muted);min-height:44px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.scale{display:flex;gap:6px}
.scale button{flex:1;min-width:0;height:44px;border-radius:var(--r-in);border:1px solid var(--line);background:var(--surface);font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.scale button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.yn{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.yn:first-child{border-top:0;padding-top:0}
.yn .q{flex:1;min-width:0;font-size:.95rem;line-height:1.4}
.yn .seg{width:124px;flex:none}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 18px;font-weight:600;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.wide{width:100%}
.btn.lg{min-height:54px;font-size:1.05rem}
.link{border:0;background:none;color:var(--accent);font-weight:600;min-height:44px;padding:0 6px;display:inline-flex;align-items:center;gap:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.stepper .big{min-width:44px;text-align:center;font-size:1.6rem}
input[type=range]{width:100%;accent-color:var(--accent);min-height:44px}
.anchors{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}

/* onboarding */
.prog{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px}
.ob{display:flex;flex-direction:column;gap:20px;padding-top:8px}
.ob h1{font-size:1.45rem}
.ob .hint{color:var(--muted)}
.ob-foot{display:flex;gap:10px;padding-top:8px}
.ob-foot .btn{flex:1}
.ob-foot .btn.ghost{flex:0 0 auto;min-width:96px}
.waist{display:flex;gap:14px;align-items:flex-start}
.waist svg{width:72px;height:96px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.waist svg .m{stroke:var(--accent);stroke-dasharray:3 3}
.test{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.test:first-child{border-top:0;padding-top:0}
.test .tm{display:flex;align-items:center;gap:12px}
.test .tm .big{font-size:2rem;min-width:84px}

/* start */
.start{display:flex;flex-direction:column;gap:20px;padding:12vh 0 0;min-height:70vh}
.start h1{font-size:2.3rem}
.start .lead{font-size:1.08rem;color:var(--ink)}

/* today */
.hero .big{font-size:2.4rem}
.hero .ic{width:28px;height:28px}
.daylbl{color:var(--muted);font-size:.9rem}
.blocks{display:flex;flex-direction:column;gap:4px}
.blocks .bk{display:flex;gap:10px;font-size:.9rem;align-items:baseline}
.blocks .bk b{font-weight:500;color:var(--muted);min-width:76px}

/* program */
.day{display:flex;flex-direction:column}
.day .items{padding:4px 0 8px 0;display:flex;flex-direction:column;gap:10px}
.blk{display:flex;flex-direction:column;gap:8px}
.blk h3{font-size:.86rem;color:var(--muted);font-weight:500}
.it{display:flex;flex-direction:column;gap:6px;padding:8px 0 8px 12px;border-left:2px solid var(--line)}
.it .nm{font-weight:600}
.it .ds{color:var(--muted);font-size:.9rem}
.dw{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.86rem;background:var(--sunk);color:var(--muted);flex:none}
.dw.on{background:var(--ink);color:var(--bg)}
.dw.done{background:var(--ok);color:#fff}
.dw.today{box-shadow:0 0 0 2px var(--accent)}

/* food */
.hands{display:flex;gap:10px;flex-wrap:wrap}
.hand{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:64px;background:var(--sunk);border-radius:var(--r-in);padding:10px 6px}
.hand svg{width:34px;height:34px;stroke:var(--ink);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.hand b{font-family:var(--display);font-weight:600;font-size:1.1rem;letter-spacing:-.02em}
.hand small{color:var(--muted);font-size:.78rem;text-align:center}
.meal{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0;padding-top:0}
.meal:last-child{padding-bottom:0}
.meal .mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meal ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.meal li{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.meal li span:last-child{color:var(--muted);white-space:nowrap}
.shop{display:flex;flex-direction:column;gap:12px}
.shop h3{font-size:.86rem;color:var(--muted);font-weight:500;padding-top:4px}
.shop .si{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.shop .si b{font-weight:600}
.shop .si small{color:var(--muted);font-size:.84rem}
.est{font-size:.74rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:middle;font-weight:500}
.tips{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.tips li::marker{color:var(--accent)}

/* chart */
.chart{width:100%;height:190px;display:block;color:var(--ink)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .raw{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 4;stroke-linejoin:round;stroke-linecap:round}
.chart .ema{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:0;border-top:2.5px solid var(--accent);margin-right:6px;vertical-align:middle}
.legend i.raw{border-top:1.5px dashed var(--muted)}
.weeks{display:flex;gap:6px}
.weeks i{flex:1;height:10px;border-radius:3px;background:var(--sunk)}
.weeks i.hit{background:var(--ok)}
.weeks i.cur{box-shadow:inset 0 0 0 1.5px var(--accent)}

/* sheet */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;pointer-events:none}
.backdrop.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:20px 20px 0 0;max-height:calc(100dvh - 40px);overflow:auto;transform:translateY(105%);padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#sheet:not(.open){visibility:hidden}
#sheet.open{transform:none;visibility:visible}
#sheet .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#sheet .handle{width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px}
#sheet .foot{display:flex;gap:10px;position:sticky;bottom:0;background:var(--surface);padding-top:10px}
#sheet .foot .btn{flex:1}
.changes{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px}

/* player */
#player{position:fixed;inset:0;z-index:40;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
#player .in{max-width:640px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;gap:16px}
#player .ph{display:flex;align-items:center;justify-content:space-between;gap:12px}
#player .ph .x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
#player .dots{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
#player .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
#player .dots i.done{background:var(--muted)}
#player .dots i.cur{background:var(--accent);width:18px;border-radius:3px}
#player .blk-lbl{color:var(--rc,var(--accent));font-weight:600;font-size:.9rem}
#player h1{font-size:1.75rem}
#player .side{font-size:1rem;color:var(--muted);font-weight:500}
#player .clock{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 0;text-align:center}
#player .clock .big{font-size:5.2rem}
#player .clock .big.rest{color:var(--ok)}
#player .clock .sub{color:var(--muted);font-size:.95rem}
#player .ring{position:relative;width:min(62vw,240px);height:min(62vw,240px);display:grid;place-items:center}
#player .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#player .ring circle{fill:none;stroke-width:6;stroke:var(--sunk)}
#player .ring circle.fg{stroke:var(--rc,var(--accent));stroke-linecap:round;transition:stroke-dashoffset .25s linear}
#player .ring circle.fg.rest{stroke:var(--ok)}
#player .cues{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
#player .cues li::marker{color:var(--accent)}
#player .ctl{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;margin-top:auto;padding-top:8px}
#player .ctl button{min-height:60px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:1.05rem}
#player .ctl button.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#player .ctl button.main .ic{width:24px;height:24px}
#player .ctl2{display:flex;gap:10px;justify-content:center}
#player .ctl2 button{border:0;background:none;color:var(--accent);font-weight:600;min-height:44px;padding:0 12px;display:inline-flex;align-items:center;gap:6px}
#player .end{display:flex;flex-direction:column;gap:16px;padding-top:8vh;text-align:left}
#player .end .big{font-size:3.4rem}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:500;opacity:0;pointer-events:none;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.login{display:flex;flex-direction:column;gap:14px;padding-top:8vh}

@media (prefers-reduced-motion:no-preference){
  .toast{transition:opacity .22s var(--ease),transform .3s var(--ease)}
  #sheet{transition:transform .36s var(--ease),visibility 0s linear .36s}
  #sheet.open{transition:transform .36s var(--ease),visibility 0s}
  .backdrop{transition:opacity .22s ease}
  .bar i,.prog i{transition:width .4s var(--ease)}
  .chip,.opt,.seg button,.scale button,nav.tabs button,.btn,.dw{transition:background-color .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease),opacity .18s var(--ease),transform .18s var(--ease)}
  .btn:active,.chip:active,.opt:active,.stepper button:active,#player .ctl button:active{transform:scale(.97)}
  #main.enter-l{animation:slideL .22s var(--ease)}
  #main.enter-r{animation:slideR .22s var(--ease)}
  #main.enter{animation:fade .22s var(--ease)}
  #player:not([hidden]){animation:fadeUp .26s var(--ease)}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
  #main.enter,#main.enter-l,#main.enter-r{animation:fade .18s ease!important}
  .btn:active,.chip:active{transform:none}
  #sheet{transform:none}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
</style>
</head>
