<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Jiu-jitsu</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef0f4;--surface:#fff;--sunk:#f1f3f7;--ink:#0f1419;--muted:#667085;--line:#e1e5ec;--accent:#1f56d9;--accent-soft:#e6edfd;--ok:#1f9a48;--ok-soft:#e3f7e8;--warn:#c25e00;--warn-soft:#fff2df;--bad:#d93a30;--bad-soft:#ffe8e6;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f1217;--surface:#171b23;--sunk:#1f2430;--ink:#f3f5f9;--muted:#97a1b3;--line:#2a303c;--accent:#5b8dff;--accent-soft:#182a52;--ok:#3ddc6a;--ok-soft:#10301b;--warn:#ffa531;--warn-soft:#3a2706;--bad:#ff5a4f;--bad-soft:#3d1210;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em}h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1rem}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside h1{padding:0 8px 14px}aside button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
aside button[aria-current]{background:var(--accent-soft);color:var(--accent)}aside .who{margin-top:auto;font-size:.8rem;color:var(--muted);padding:0 8px;word-break:break-all}
main{padding:24px 28px;display:flex;flex-direction:column;gap:18px;max-width:1200px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stat b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1.1}.stat span{color:var(--muted);font-size:.82rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:.9rem}th{text-align:left;color:var(--muted);font-weight:600;font-size:.78rem;padding:6px 8px;border-bottom:1px solid var(--line)}td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
.pill{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer;font-size:.86rem}.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}.btn.danger{background:var(--bad-soft);color:var(--bad)}.btn:disabled{opacity:.5}
input,select,textarea{font:inherit;color:inherit;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px}input[type=search]{min-width:260px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
code{font-family:var(--display);font-size:1rem;letter-spacing:.08em;background:var(--sunk);padding:2px 8px;border-radius:6px}
.muted{color:var(--muted)}.small{font-size:.84rem}.empty{color:var(--muted);padding:14px 0;text-align:center}
#login{max-width:380px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:20;padding:16px}.modal form{background:var(--surface);border-radius:16px;padding:20px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--accent)}.bar.full i{background:var(--ok)}
.sw{display:inline-block;width:28px;height:10px;border-radius:2px;border:1px solid var(--line);vertical-align:middle;margin-right:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:inherit;font-size:.84rem;font-weight:600;color:var(--muted);cursor:pointer}.tabs button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}aside h1{width:100%;padding-bottom:6px}aside .who{margin-top:0;width:100%}main{padding:16px}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="meta.js?v=3"></script>
<script src="seed.js?v=7"></script>
<script src="admin.js?v=2"></script>
</body>
</html>
