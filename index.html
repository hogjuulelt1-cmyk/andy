<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дэвтэр">
<title>Chinbilig Хөгжлийн Дэвтэр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
input[type=email],input[type=password]{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px}
body.locked .icon-btn{display:none}
:root{
  --bg:#f2f2f7; --surface:#ffffff; --sunk:#f2f2f7; --ink:#111114; --muted:#6c6c72; --line:#e3e3e8;
  --accent:#007aff; --accent-ink:#ffffff; --accent-soft:#e5f0ff;
  --ok:#1f8a3b; --ok-soft:#e3f7e8; --warn:#c25e00; --warn-soft:#fff2df; --bad:#e0241b; --bad-soft:#ffe8e6;
  --p-bjj:#007aff; --p-body:#34c759; --p-mind:#af52de; --p-school:#ff9500; --p-biz:#a2845e;
  --heat0:#e9e9ee; --heat1:#cfe3ff; --heat2:#8cc0ff; --heat3:#3395ff; --heat4:#007aff;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  --bar-bg:rgba(249,249,251,.82);
  --ease:cubic-bezier(.32,.72,0,1);
  --display:"Oswald","Arial Narrow",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","IBM Plex Sans",system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --surface:#1c1c1e; --sunk:#2c2c2e; --ink:#f5f5f7; --muted:#a1a1a8; --line:#38383a;
    --accent:#0a84ff; --accent-ink:#ffffff; --accent-soft:#0f2a4d;
    --ok:#30d158; --ok-soft:#0f3019; --warn:#ff9f0a; --warn-soft:#3a2706; --bad:#ff453a; --bad-soft:#3d1210;
    --p-bjj:#0a84ff; --p-body:#30d158; --p-mind:#bf5af2; --p-school:#ff9f0a; --p-biz:#ac8e68;
    --heat0:#2c2c2e; --heat1:#10345e; --heat2:#1a5aa8; --heat3:#0a84ff; --heat4:#64b0ff;
    --shadow:none; --bar-bg:rgba(28,28,30,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --surface:#1c1c1e; --sunk:#2c2c2e; --ink:#f5f5f7; --muted:#a1a1a8; --line:#38383a;
  --accent:#0a84ff; --accent-ink:#ffffff; --accent-soft:#0f2a4d;
  --ok:#30d158; --ok-soft:#0f3019; --warn:#ff9f0a; --warn-soft:#3a2706; --bad:#ff453a; --bad-soft:#3d1210;
  --p-bjj:#0a84ff; --p-body:#30d158; --p-mind:#bf5af2; --p-school:#ff9f0a; --p-biz:#ac8e68;
  --heat0:#2c2c2e; --heat1:#10345e; --heat2:#1a5aa8; --heat3:#0a84ff; --heat4:#64b0ff;
  --shadow:none; --bar-bg:rgba(28,28,30,.8);
}
*{box-sizing:border-box}
html,body{background:var(--bg);overflow-x:hidden;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-y}
body{-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,a,[data-act]{touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.25rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:1.02rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px!important}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{display:flex;flex-direction:column;gap:10px;padding-block:18px 4px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;flex-direction:column;gap:6px;min-width:0}
.who h1{font-size:1.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.belt{display:flex;height:14px;width:200px;max-width:min(60vw,100%);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.belt .b-main{flex:1}
.belt .b-bar{width:34%;display:flex;gap:4px;align-items:stretch;justify-content:flex-end;padding:0 6px}
.belt .b-bar i{width:4px;background:#fff}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--ok)} .sync.saving .dot{background:var(--warn)} .sync.err .dot{background:var(--bad)}
.icon-btn{min-height:40px;border:0;background:var(--surface);color:var(--accent);box-shadow:var(--shadow);border-radius:999px;padding:8px 12px;font-size:.88rem;font-weight:600}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.tabs button{border:0;background:none;padding:6px 0;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;white-space:nowrap;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* cards */
.card{background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .d{font-family:var(--display);font-size:1.3rem;font-weight:600;text-align:center}
.datebar .d small{display:block;font-family:var(--body);font-size:.78rem;color:var(--muted);font-weight:500}
.stepper{border:0;background:var(--sunk);color:var(--accent);border-radius:50%;width:42px;height:42px;font-size:1.2rem}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.summary.four{grid-template-columns:repeat(4,1fr)}
.summary.four .stat b{font-size:1.4rem}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.check{position:relative;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.check svg{width:16px;height:16px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on svg{opacity:1}
.row .txt{flex:1;min-width:0}
.row.done .txt{color:var(--muted);text-decoration:line-through}
.pdot{flex:none;width:9px;height:9px;border-radius:50%}
.time{font-variant-numeric:tabular-nums;font-weight:600;min-width:46px}
.group-label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:6px;display:flex;align-items:center;gap:6px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scale{display:flex;gap:6px}
.scale button{flex:1;min-width:0;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-weight:600;font-variant-numeric:tabular-nums}
.scale button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale-ends{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:500}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 16px;font-weight:600;min-height:42px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.x{border:0;background:none;color:var(--muted);font-size:.84rem;padding:6px 10px;border-radius:10px;min-height:44px;min-width:44px}
.x.confirm{color:var(--bad);background:var(--bad-soft);font-weight:600}
.meal{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.86rem}
.src{font-size:.74rem;color:var(--muted)}

.guards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.guard:last-child:nth-child(odd){grid-column:1 / -1}
@media (max-width:480px){.guards{grid-template-columns:1fr}}
.guard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.guard .gh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.guard b{font-size:.9rem}
.guard .val{font-family:var(--display);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.pill{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.na{background:var(--sunk);color:var(--muted)}
.flags{background:var(--bad-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.flags b{color:var(--bad)}
.flags ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.allgood{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:10px 14px;font-weight:600;font-size:.9rem}

.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:140px}
.bars .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars .b i{display:block;width:100%;max-width:34px;background:var(--heat2);border-radius:3px 3px 0 0;min-height:2px}
.bars .b.cur i{background:var(--accent)}
.bars .b span{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bars-x{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;font-size:.68rem;color:var(--muted);text-align:center}

.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:340px}
.heat .c{aspect-ratio:1;border-radius:4px;background:var(--heat0);max-width:100%;display:grid;place-items:center;font-size:.62rem;color:var(--muted)}
.heat .l1{background:var(--heat1)} .heat .l2{background:var(--heat2)} .heat .l3{background:var(--heat3);color:#fff} .heat .l4{background:var(--heat4);color:#fff}
.heat .future{background:transparent;border:1px dashed var(--line)}
.heat-h{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:340px;font-size:.68rem;color:var(--muted);text-align:center}

.jars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.jar{border:0;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--sunk)}
.jar b{font-family:var(--display);font-size:1.2rem;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.jar span{font-size:.76rem;color:var(--muted)}
.amt-in{color:var(--ok);font-weight:600} .amt-out{color:var(--bad);font-weight:600}
.sess{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.sess .sh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
details summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.84rem}
.sched-day{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.sched-day:first-of-type{border-top:0}
.sched-item{display:grid;grid-template-columns:78px 1fr 110px auto;gap:6px;align-items:center}
@media (max-width:520px){.sched-item{grid-template-columns:70px 1fr auto}.sched-item .pp{grid-column:1 / 3}}
.hab-item{display:grid;grid-template-columns:1fr 130px auto;gap:6px;align-items:center}
@media (max-width:480px){.hab-item{grid-template-columns:1fr auto}.hab-item select{grid-column:1}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{border:1px solid transparent;background:none;border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.wd span{font-size:.7rem;color:var(--muted);font-weight:600}
.wd b{font-family:var(--display);font-size:1.1rem;font-weight:600;font-variant-numeric:tabular-nums}
.wd i{width:8px;height:8px;border-radius:50%;background:var(--heat0)}
.wd i.lv1{background:var(--heat2)} .wd i.lv2{background:var(--heat3)} .wd i.lv3{background:var(--ok)} .wd i.lvf{background:transparent;border:1px dashed var(--line)}
.wd.now b{color:var(--accent)}
.wd.sel{background:var(--accent-soft);border-color:var(--accent)}
.streak{font-size:.86rem;color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:8px 12px}
.focus{background:var(--surface);border:0;box-shadow:inset 0 0 0 1.5px var(--accent);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
details.fold{gap:0}
details.fold>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h2{flex:1}
details.fold .chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px}
details.fold[open] .chev{transform:rotate(-135deg);margin-bottom:-4px}
details.fold .fold-body{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.meter{display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.lib{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.lib:first-child{border-top:0}
.lib-h{display:flex;gap:10px;align-items:flex-start}
.lib-h .pdot{margin-top:8px}
.lib-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.lib-t a{color:var(--ink);font-weight:600;text-decoration-color:var(--line);text-underline-offset:3px}
.lib-t a:hover{color:var(--accent)}
.lib.seen .lib-t a,.lib.seen .lib-t>span:first-child{color:var(--muted)}
.lib-a{display:flex;justify-content:space-between;align-items:center;gap:8px}
.star{border:0;background:none;font-size:1.3rem;line-height:1;color:var(--line);padding:4px;min-width:44px;min-height:44px}
.star.on{color:#e2b41a}
.filelink{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--sunk);color:var(--ink);text-decoration:none;font-size:.84rem;overflow-wrap:anywhere}
.filelink img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none}
input[type=url],input[type=file]{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--heat0);border:0;border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:8px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ov-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ov-nums div{display:flex;flex-direction:column;gap:0;min-width:0}
.ov-nums b{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.1}
.ov-nums span{font-size:.72rem;color:var(--muted);line-height:1.25}
.ov-rows{display:flex;flex-direction:column;gap:8px}
.ov-row{display:grid;grid-template-columns:auto 72px 1fr 40px;gap:8px;align-items:center;font-size:.84rem}
.ov-p{text-align:right;font-weight:600}
button.pill{border:0;cursor:pointer;font-size:.76rem;padding:4px 10px}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:.7rem;color:var(--muted);text-align:center;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{aspect-ratio:1/1.1;max-width:100%;border:1px solid transparent;border-radius:8px;background:var(--heat0);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px 6px;min-width:0}
.cd b{font-size:.86rem;font-weight:600;font-variant-numeric:tabular-nums}
.cd.h1{background:var(--heat1)} .cd.h2{background:var(--heat2)} .cd.h3{background:var(--heat3);color:#fff} .cd.hf{background:var(--sunk)}
.cd.out{opacity:.35}
.cd.now{border-color:var(--ink);border-width:2px}
.mks{display:flex;gap:3px;min-height:7px}
.mk{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.mk.tr{background:var(--p-bjj);box-shadow:0 0 0 1.5px var(--surface)} .mk.tr.comp{background:#e2b41a} .mk.tk{background:var(--p-school);box-shadow:0 0 0 1.5px var(--surface)} .mk.sc{background:var(--bad);box-shadow:0 0 0 1.5px var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px}
.sw.h1{background:var(--heat1)} .sw.h2{background:var(--heat2)} .sw.h3{background:var(--heat3)}
button.row.agenda{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit}

/* ---------- Supabase backend (plain REST, no SDK) ---------- */
const CFG=window.APP_CONFIG||{};
const SB={
  url:(CFG.supabaseUrl||"").replace(/\/$/,""),key:CFG.supabaseAnonKey||"",session:null,
  configured(){return !!(this.url&&this.key);},
  loadSession(){try{this.session=JSON.parse(localStorage.getItem("cb-sb-session")||"null");}catch(e){this.session=null;}},
  storeSession(s){this.session=s;try{s?localStorage.setItem("cb-sb-session",JSON.stringify(s)):localStorage.removeItem("cb-sb-session");}catch(e){}},
  async auth(body,grant){
    const r=await fetch(this.url+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:this.key,"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||"auth");
    this.storeSession({access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,email:j.user&&j.user.email});return this.session;
  },
  login(email,password){return this.auth({email,password},"password");},
  async token(){
    if(!this.session)throw new Error("noauth");
    if(Date.now()>this.session.exp-60000){try{await this.auth({refresh_token:this.session.refresh},"refresh_token");}catch(e){this.storeSession(null);throw new Error("noauth");}}
    return this.session.access;
  },
  async req(path,opt){
    opt=opt||{};const t=await this.token();
    const r=await fetch(this.url+path,Object.assign({},opt,{headers:Object.assign({apikey:this.key,Authorization:"Bearer "+t},opt.headers||{})}));
    if(r.status===401){this.storeSession(null);throw new Error("noauth");}
    if(!r.ok)throw new Error("http "+r.status);return r;
  },
  async loadAll(){
    const out=[];let from=0;
    for(;;){const r=await this.req("/rest/v1/docs?select=path,data&order=path",{headers:{Range:from+"-"+(from+999),"Range-Unit":"items"}});const rows=await r.json();out.push(...rows);if(rows.length<1000)break;from+=1000;}
    return out;
  },
  set(path,data){return this.req("/rest/v1/docs",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({path,data,updated_at:new Date().toISOString()})});},
  del(path){return this.req("/rest/v1/docs?path=eq."+encodeURIComponent(path),{method:"DELETE"});},

    return{id,contentType:type,sizeBytes:file.size};
  },
  delete(id){return this.req("/storage/v1/object/library/"+id,{method:"DELETE"});},
  signed:{},

    const c=this.signed[id];if(c&&c.exp>Date.now())return c.url;

    return "";
  }
};

async function refreshAll(){
  const rows=await SB.loadAll();const seen=new Set();

  ["days","tasks","reviews","library"].forEach(c=>Object.keys(S[c]).forEach(id=>{const p=c+"/"+id;if(!seen.has(p)&&!dirty[p])delete S[c][id];}));
  requestRender();
}
async function startCloud(){
  setSync("saving","Ачаалж байна…");

  document.body.classList.remove("locked");mode="cloud";db=true;assetsApi=SB;downloadsApi=DL;readyResolve();setSync("ok");render();
  clearInterval(pollTimer);pollTimer=setInterval(()=>{if(!document.hidden&&!Object.keys(dirty).length)refreshAll().catch(()=>{});},60000);
  if(!startCloud.vis){startCloud.vis=true;document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!Object.keys(dirty).length)refreshAll().catch(()=>{});});}
}
async function importBackup(file){

/* ----- stats ----- */
function statsFor(dates){
  const today=todayIso(),hs=S.settings.habits;let hDone=0,hTot=0,min=0,load=0,n=0,rest=0,days=0,soreHigh=0,pain=0;const sl=[],mood=[],en=[],enj=[],w=[],scr=[];
  for(const ds of dates){
    if(ds>today)continue;days++;hTot+=hs.length;const d=S.days[ds];
    if(!d){rest++;continue;}
    hDone+=hs.filter(h=>d.habits&&d.habits[h.id]).length;
    const ss=d.sessions||[];if(!ss.length)rest++;
    ss.forEach(s=>{const m=+s.min||0;min+=m;load+=m*(+s.rpe||0);n++;if(+s.enj)enj.push(+s.enj);});
    if(+d.sleep)sl.push(+d.sleep);if(d.srec!==""&&d.srec!=null)scr.push(+d.srec||0);if(+d.mood)mood.push(+d.mood);if(+d.energy)en.push(+d.energy);
    if(+d.soreness>=4)soreHigh++;if((d.pain||"").trim())pain++;if(+d.weight)w.push([ds,+d.weight]);
  }
  return{days,habitPct:hTot?hDone/hTot:0,min,load,n,rest,sleep:avg(sl),mood:avg(mood),energy:avg(en),enjoy:avg(enj),soreHigh,pain,weights:w,screen:avg(scr)};
}
function dayPct(ds){const d=S.days[ds],hs=S.settings.habits;if(!d||!hs.length)return 0;return hs.filter(h=>d.habits&&d.habits[h.id]).length/hs.length;}
function guardCards(dates,prevLoads){
  const st=statsFor(dates),age=+S.settings.profile.age,hrs=st.min/60,[smin]=sleepTarget();
  const g=[];
  g.push({t:"Зохион байгуулалттай бэлтгэл",v:hrs.toFixed(1)+" цаг",s:!age?"na":hrs<=age?"ok":"bad",d:age?"Долоо хоногт "+age+" цагаас (насаараа) ихгүй":"Тохиргоонд насаа оруулна уу",src:"Jayanthi 2015"});
  g.push({t:"Амралтын өдөр",v:st.rest+" өдөр",s:st.days<7?"na":st.rest>=2?"ok":st.rest===1?"warn":"bad",d:"Долоо хоногт 1–2 өдөр бүрэн амрах",src:"AAP 2016"});
  g.push({t:"Дундаж нойр",v:st.sleep==null?"–":st.sleep.toFixed(1)+" цаг",s:st.sleep==null?"na":st.sleep>=smin?"ok":st.sleep>=smin-1?"warn":"bad",d:"Зорилт "+sleepTarget()[0]+"–"+sleepTarget()[1]+" цаг ("+sleepTarget()[2]+")",src:"Milewski 2014, AASM 2016"});
  const pa=avg(prevLoads.filter(x=>x>0));const ratio=pa?st.load/pa:null;
  g.push({t:"Ачааллын өсөлт",v:ratio==null?"–":"×"+ratio.toFixed(2),s:ratio==null?"na":ratio<=1.3?"ok":ratio<=1.5?"warn":"bad",d:"Өмнөх 3 долоо хоногийн дунджаас 1.5 дахин огцом бүү өсгө (мин × RPE)",src:"Foster 2001, Gabbett 2016"});
  g.push({t:"Дэлгэц (зугаа цэнгэл)",v:st.screen==null?"–":Math.round(st.screen)+" мин/өдөр",s:st.screen==null?"na":st.screen<=SCREEN_MAX?"ok":st.screen<=180?"warn":"bad",d:"Хичээлээс гадуурх дэлгэц өдөрт 2 цагаас ихгүй",src:"Canadian 24-Hour Guidelines 2016, AAP"});
  const lbl={ok:"Хэвийн",warn:"Анхаар",bad:"Хэтэрсэн",na:"Мэдээлэл дутуу"};
  return '<div class="guards">'+g.map(x=>'<div class="guard"><div class="gh"><b>'+x.t+'</b><span class="pill '+x.s+'">'+lbl[x.s]+'</span></div><span class="val">'+x.v+'</span><span class="small muted">'+x.d+'</span><span class="src">'+x.src+"</span></div>").join("")+"</div>";
}

/* ----- LIBRARY ----- */
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return "";}}
function safeUrl(u){u=(u||"").trim();if(!u)return "";if(!/^https?:\/\//i.test(u))u="https://"+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:"";}catch(e){return "";}}
function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";}
function vLib(){
  const all=Object.values(S.library).sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||(b.created||"").localeCompare(a.created||""));

/* ---------- events ---------- */
function targetOf(kind){
  if(kind==="day")return[ensureDay(UI.date),"days/"+UI.date];
  if(kind==="biz")return[S.biz,"app/business"];
  if(kind==="set")return[S.settings,"app/settings"];
  if(kind==="rev"){const id="w"+weekStart();return[ensureReview(id),"reviews/"+id];}
}
function onInput(e){
  const el=e.target;
  if(el.id==="lib-q"){const q=el.value.toLowerCase().trim();document.querySelectorAll("#lib-list .lib").forEach(r=>{r.hidden=!!q&&!r.dataset.q.includes(q);});return;}
  if(el.id==="tech-q"){const q=el.value.toLowerCase().trim();document.querySelectorAll("#tech-list .row").forEach(r=>{r.hidden=!!q&&!r.dataset.q.includes(q);});return;}
  const p=el.dataset&&el.dataset.path;if(!p)return;
  const i=p.indexOf(":");const [obj,path]=targetOf(p.slice(0,i));
  let v=el.value;if(el.type==="number")v=v===""?"":Number(v);
  if(p==="set:profile.stripes")v=Number(v);
  setPath(obj,p.slice(i+1),v);save(path);
  if(p.startsWith("set:profile.")||p==="set:currency")renderHeader();
}
document.addEventListener("input",onInput);
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));

function setDoc(path,v){if(path==="app/settings")S.settings=v;else if(path==="app/business")S.biz=v;else{const [c,id]=path.split("/");if(v==null)delete S[c][id];else S[c][id]=v;}}

let confirmTimer=null;

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(!b){if(UI.confirm){UI.confirm=null;requestRender();}return;}
  const a=b.dataset.act,ds=b.dataset;
  const needsConfirm=a.startsWith("del")||a==="logout";
  if(needsConfirm&&UI.confirm!==ds.key){armConfirm(ds.key);render();return;}
  UI.confirm=null;clearTimeout(confirmTimer);undoPath=null;
  let after=null;
  const val=id=>{const el=document.getElementById(id);return el?el.value:"";};
  switch(a){
    case "closeset":UI.tab=UI.prevTab||"today";try{localStorage.setItem("cb-tab",UI.tab);}catch(err){}go("enter-r");return;
    case "tab":{if(ds.v==="settings"&&UI.tab==="settings"){UI.tab=UI.prevTab||"today";try{localStorage.setItem("cb-tab",UI.tab);}catch(err){}go("enter-r");return;}
      if(UI.tab===ds.v){window.scrollTo({top:0});return;}if(ds.v==="settings")UI.prevTab=UI.tab;const order=TABS.map(t=>t[0]).concat("settings"),dir=order.indexOf(ds.v)>order.indexOf(UI.tab)?"enter-l":"enter-r";UI.tab=ds.v;try{localStorage.setItem("cb-tab",ds.v);}catch(err){}go(dir);return;}
    case "dprev":UI.date=addDays(UI.date,-1);break;
    case "dnext":UI.date=addDays(UI.date,1);break;
    case "dtoday":UI.date=todayIso();break;
    case "dset":UI.date=ds.v;break;
    case "view":UI.view=ds.v;if(ds.v==="cal")UI.calMonth=UI.date.slice(0,7);try{localStorage.setItem("cb-view",ds.v);}catch(err){}break;
    case "calday":UI.date=ds.v;UI.view="day";try{localStorage.setItem("cb-view","day");}catch(err){}go("enter");return;
    case "mprev":case "mnext":{const [yy,mm]=UI.calMonth.split("-").map(Number);const dd=new Date(yy,mm-1+(a==="mnext"?1:-1),1);UI.calMonth=dd.getFullYear()+"-"+pad(dd.getMonth()+1);break;}
    case "addscreen":{const d=ensureDay(UI.date);d.srec=(+d.srec||0)+(+ds.v);save("days/"+UI.date);toast("+"+ds.v+" мин нэмэгдлээ");break;}
    case "libfilter":UI.libFilter=ds.v;break;
    case "addlib":addLib(b);return;
    case "addlibsug":{const x=LIB_SUGGEST[+ds.i];if(x){const id=uid();S.library[id]={id,t:x.t,url:x.url,p:x.p,kind:x.kind,note:"",fav:false,done:false,created:todayIso()};save("library/"+id);}break;}
    case "libfav":{const x=S.library[ds.id];if(x){x.fav=!x.fav;save("library/"+ds.id);}break;}
    case "libdone":{const x=S.library[ds.id];if(x){x.done=!x.done;save("library/"+ds.id);}break;}
    case "dellib":{const x=S.library[ds.id];undoable("library/"+ds.id);delete S.library[ds.id];remove("library/"+ds.id);
      if(x&&x.file&&assetsApi){const fid=x.file.id,path="library/"+ds.id;after=()=>{if(!S.library[ds.id])assetsApi.delete(fid).catch(()=>{});};}break;}
    case "logout":SB.storeSession(null);location.reload();return;
    case "backup":{if(!downloadsApi)return;downloadsApi.save({filename:"chinbilig-backup-"+todayIso()+".json",data:JSON.stringify(S,null,2)}).catch(e=>{if(e&&e.code!=="declined")toast("Татаж чадсангүй");});return;}
    case "wprev":UI.wk--;break;
    case "wnext":if(UI.wk<0)UI.wk++;break;
    case "habit":{const d=ensureDay(UI.date);d.habits[ds.id]=!d.habits[ds.id];if(!d.habits[ds.id])delete d.habits[ds.id];save("days/"+UI.date);break;}
    case "sched":{const d=ensureDay(UI.date);if(d.sched[ds.k])delete d.sched[ds.k];else d.sched[ds.k]=true;save("days/"+UI.date);break;}
    case "scale":{const d=ensureDay(UI.date);const n=+ds.v;d[ds.f]=d[ds.f]===n?0:n;save("days/"+UI.date);break;}
    case "mealpart":{const d=ensureDay(UI.date);const m=d.meals[ds.m]=d.meals[ds.m]||{x:"",parts:[]};m.parts=m.parts||[];const k=m.parts.indexOf(ds.p);if(k>=0)m.parts.splice(k,1);else m.parts.push(ds.p);save("days/"+UI.date);break;}
    case "sftype":UI.sfType=ds.v;break;
    case "addsess":{
      const date=val("sf-date")||UI.date;if(date>todayIso()){toast("Ирээдүйн өдөрт бүртгэх боломжгүй");return;}
      const min=+val("sf-min");if(!min){document.getElementById("sf-min").focus();return;}
      const d=ensureDay(date);
      d.sessions.push({type:UI.sfType,min,rpe:+val("sf-rpe"),enj:+val("sf-enj"),tech:val("sf-tech").trim(),work:val("sf-work").trim(),q:val("sf-q").trim(),res:val("sf-res").trim()});
      save("days/"+date);toast("Бэлтгэл хадгалагдлаа");break;}
    case "delsess":{const d=S.days[ds.d];if(d){undoable("days/"+ds.d);d.sessions.splice(+ds.i,1);save("days/"+ds.d);}break;}
    case "filter":UI.filter=ds.v;break;
    case "addtask":{const t=val("g-t").trim();if(!t){document.getElementById("g-t").focus();return;}toast("Нэмэгдлээ");const id=uid();S.tasks[id]={id,t,p:val("g-p"),kind:val("g-k"),due:val("g-due"),done:false,created:todayIso()};save("tasks/"+id);break;}
    case "addsug":{const id=uid();S.tasks[id]={id,t:ds.t,p:ds.p,kind:"goal",due:"",done:false,created:todayIso()};save("tasks/"+id);toast("Зорилго нэмэгдлээ");break;}
    case "toggletask":{const x=S.tasks[ds.id];if(x){x.done=!x.done;x.doneAt=x.done?todayIso():"";save("tasks/"+ds.id);}break;}
    case "deltask":undoable("tasks/"+ds.id);delete S.tasks[ds.id];remove("tasks/"+ds.id);break;
    case "etype":UI.etype=ds.v;break;
    case "addentry":{const amt=+val("e-amt");if(!amt){document.getElementById("e-amt").focus();return;}toast("Гүйлгээ нэмэгдлээ");const en={id:uid(),type:UI.etype,amt,date:val("e-date")||todayIso(),note:val("e-note").trim()};if(UI.etype==="out")en.jar=val("e-jar");else en.src=val("e-src");S.biz.entries.push(en);save("app/business");break;}
    case "delentry":undoable("app/business");S.biz.entries=S.biz.entries.filter(x=>x.id!==ds.id);save("app/business");break;
    case "addhabit":{const t=val("nh-t").trim();if(!t){document.getElementById("nh-t").focus();toast("Зуршлын нэрээ бичнэ үү");return;}S.settings.habits.push({id:"h"+uid(),t,p:val("nh-p")});save("app/settings");toast("Зуршил нэмэгдлээ");break;}
    case "delhabit":undoable("app/settings");S.settings.habits.splice(+ds.i,1);save("app/settings");break;
    case "addsched":{const k=ds.dw;const L=(S.settings.schedule[k]=S.settings.schedule[k]||[]);L.push({t:"",x:"",p:"bjj"});save("app/settings");const i=L.length-1;after=()=>{const el=document.querySelector('[data-path="set:schedule.'+k+"."+i+'.t"]');if(el)el.focus();};break;}
    case "delsched":undoable("app/settings");S.settings.schedule[ds.dw].splice(+ds.i,1);save("app/settings");break;
  }
  render();
  markJust(a,ds);
  if(undoPath){const path=undoPath,prev=undoPrev,fin=after;after=null;
    toast("Устгагдлаа",{label:"Буцаах",run:()=>{setDoc(path,prev);save(path);render();toast("Сэргээгдлээ");},done:fin});}
  if(after)after();
});

document.addEventListener("toggle",e=>{const el=e.target;if(el.matches&&el.matches("details.fold")){UI.open[el.dataset.fold]=el.open;try{localStorage.setItem("cb-open",JSON.stringify(UI.open));}catch(err){}}},true);
let toastTimer;
let toastDone=null;
function toast(msg,act){
  let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}
  if(toastDone){const f=toastDone;toastDone=null;f();}
  t.textContent=msg;t.classList.toggle("act",!!act);
  if(act){const btn=document.createElement("button");btn.type="button";btn.textContent=act.label;btn.addEventListener("click",ev=>{ev.stopPropagation();toastDone=null;clearTimeout(toastTimer);t.classList.remove("show","act");act.run();});t.appendChild(btn);toastDone=act.done||null;}
  t.classList.add("show");clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.classList.remove("show","act");if(toastDone){const f=toastDone;toastDone=null;f();}},act?4500:1800);
}
async function addLib(btn){
  const val=id=>{const el=document.getElementById(id);return el?el.value:"";};
  const url=safeUrl(val("l-url"));let t=val("l-t").trim();const fi=document.getElementById("l-file");const file=fi&&fi.files&&fi.files[0];
  if(val("l-url").trim()&&!url){toast("Холбоос буруу байна");return;}
  if(!url&&!t&&!file){document.getElementById("l-url").focus();toast("Холбоос, гарчиг эсвэл файл оруулна уу");return;}
  let kind=val("l-k");if(kind==="other"&&/youtu\.?be|vimeo|tiktok|instagram/.test(url))kind="video";if(file&&kind==="other")kind="file";
  const item={id:uid(),t:t||(file?file.name:hostOf(url)),url,p:val("l-p"),kind,note:val("l-n").trim(),fav:false,done:false,created:todayIso()};
  if(file){
    if(!assetsApi){toast("Файл хадгалах боломжгүй байна");return;}
    if(file.size>20*1024*1024){toast("Файл 20 MB-аас их байна");return;}
    btn.disabled=true;btn.textContent="Файл илгээж байна…";
    try{const opt={};if(!file.type){const ext=(file.name.split(".").pop()||"").toLowerCase();opt.type={pdf:"application/pdf",md:"text/markdown",txt:"text/plain",csv:"text/csv"}[ext];}
      const res=await assetsApi.upload(file,opt);item.file={id:res.id,name:file.name,type:res.contentType,size:res.sizeBytes};}
    catch(e){btn.disabled=false;btn.textContent="Хадгалах";toast(e&&e.code==="quota_exceeded"?"Хадгалах зай дүүрсэн":"Файл илгээж чадсангүй. Төрөл эсвэл хэмжээг шалгана уу.");return;}
  }
  S.library[item.id]=item;save("library/"+item.id);toast("Хадгалагдлаа");render();
}
render();
if(SB.configured()){SB.loadSession();if(SB.session)startCloud();else showLogin();}else initStoreArtifact();
})();
